name: Tweet Workflow

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY_RUN: true = tweet atma, sadece logda göster'
        required: false
        default: 'true'
  # NOT: zamanlama (schedule) canlıya alırken eklenecek — şimdilik kapalı,
  # ve manuel çalıştırmada DRY_RUN varsayılan açık, yani yanlışlıkla tweet atılmaz.

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Script
        run: python trendmerkezi.py
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.CONSUMER_SECRET }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}

      # Commit and push changes
      - name: Commit and push changes
        run: |-
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          timestamp=$(date '+%Y-%m-%d %H:%M:%S')
          git commit -m "Update Data ${timestamp}" || exit 0
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
